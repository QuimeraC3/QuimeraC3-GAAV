<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALERÍA DE ARTE AUDIOVISUAL &bull; Instituto Quimera</title>
    
    <!-- LIBRERÍA THREE.JS (MOTOR 3D EN TIEMPO REAL) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --accent-gold: #c88b32;
            --accent-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* CAPA CRT SCANLINES GLOBAL */
        .crt-scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 2000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.65;
        }

        /* FACHADA MONUMENTAL DEL CASTILLO */
        #castle-entrance {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #0b1329 0%, #020617 80%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1.2s ease, filter 1.2s ease;
            overflow: hidden;
        }

        .castle-facade {
            position: relative;
            width: min(90vw, 800px);
            height: min(80vh, 600px);
            background: linear-gradient(180deg, #0f172a 0%, #090d16 100%);
            border: 3px solid #334155;
            border-bottom: none;
            border-radius: 180px 180px 0 0;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), inset 0 0 40px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-top: 2rem;
            perspective: 1000px;
        }

        .battlements {
            position: absolute;
            top: -24px; width: 100%; height: 24px;
            display: flex; justify-content: space-around;
        }

        .merlon {
            width: 12%; height: 100%;
            background: #1e293b;
            border: 2px solid #334155;
            border-bottom: none;
        }

        .emblem-header {
            text-align: center;
            z-index: 10;
            margin-top: 1rem;
        }

        .emblem-title {
            font-family: Georgia, serif;
            font-size: clamp(1.6rem, 3.8vw, 3rem);
            color: var(--accent-gold);
            -webkit-text-stroke: 1px #ffffff;
            text-shadow: 0 0 25px rgba(200, 139, 50, 0.9), 0 0 45px rgba(56, 189, 248, 0.5);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .emblem-subtitle {
            font-family: monospace;
            color: var(--accent-blue);
            font-size: clamp(0.8rem, 1.5vw, 1.1rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 0.4rem;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
        }

        .archway {
            position: relative;
            width: min(65vw, 380px);
            height: min(50vh, 340px);
            background: #020617;
            border: 10px solid #1e293b;
            border-bottom: none;
            border-radius: 190px 190px 0 0;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            display: flex;
            overflow: hidden;
        }

        .gate-door {
            width: 50%; height: 100%;
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            border: 2px solid var(--accent-gold);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left center;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .gate-door-right { transform-origin: right center; }

        .gate-iron-bar {
            width: 80%; height: 5px;
            background: var(--accent-gold);
            box-shadow: 0 0 8px rgba(200, 139, 50, 0.6);
        }

        .gate-knocker {
            width: 30px; height: 30px;
            border: 3px solid var(--accent-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .gate-open .gate-door-left { transform: rotateY(-110deg); }
        .gate-open .gate-door-right { transform: rotateY(110deg); }

        .btn-enter {
            background: rgba(2, 6, 23, 0.9);
            border: 2px solid var(--accent-gold);
            color: #ffffff;
            padding: 0.8rem 2.5rem;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(200, 139, 50, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            z-index: 20;
        }

        .btn-enter:hover {
            background: var(--accent-gold);
            color: #000000;
            box-shadow: 0 0 45px var(--accent-gold), 0 0 65px var(--accent-blue);
            transform: scale(1.05);
        }

        /* LIENZO 3D WEBGL */
        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* HUD DE NAVEGACIÓN EN PANTALLA */
        #hud-info {
            position: fixed;
            top: 1.5rem; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--accent-blue);
            padding: 0.6rem 2rem;
            border-radius: 20px;
            font-family: monospace;
            font-size: 1.05rem;
            color: var(--accent-blue);
            z-index: 100;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            text-align: center;
        }

        /* CONTROLES TÁCTILES MÓVILES */
        .dpad-container {
            position: fixed;
            bottom: 2rem; right: 2rem;
            width: 150px; height: 150px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 100;
        }

        .dpad-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid var(--accent-blue);
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .dpad-btn:active { background: var(--accent-blue); color: #000000; }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-down { grid-column: 2; grid-row: 3; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-enter { grid-column: 2; grid-row: 2; border-color: var(--accent-gold); color: var(--accent-gold); }

        /* VENTANA MODAL CRT DE EXHIBICIÓN DE OBRA */
        #gallery-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 3000;
        }

        #gallery-modal.show { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: #0b1329;
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 2rem;
            max-width: 680px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 35px var(--accent-gold);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-preview-box {
            width: 100%;
            height: 240px;
            background: #020617;
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2);
            color: var(--accent-gold);
            font-family: Georgia, serif;
            font-size: 1.2rem;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* REPRODUCTOR DE AUDIO REAL */
        .audio-player-container {
            width: 100%;
            background: #020617;
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .track-info {
            font-family: monospace;
            color: var(--accent-blue);
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            text-align: center;
        }

        .playlist {
            max-height: 140px;
            overflow-y: auto;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            padding-top: 0.5rem;
        }

        .track-item {
            font-family: monospace;
            font-size: 0.85rem;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            color: #94a3b8;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .track-item:hover, .track-item.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
        }

        .player-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .ctrl-btn {
            background: rgba(200, 139, 50, 0.2);
            border: 1px solid var(--accent-gold);
            color: #ffffff;
            padding: 0.4rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
        }

        .ctrl-btn:hover {
            background: var(--accent-gold);
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="crt-scanlines"></div>

    <!-- FACHADA DEL CASTILLO MONUMENTAL -->
    <div id="castle-entrance">
        <div class="castle-facade">
            <div class="battlements">
                <div class="merlon"></div><div class="merlon"></div><div class="merlon"></div>
                <div class="merlon"></div><div class="merlon"></div><div class="merlon"></div>
            </div>

            <div class="emblem-header">
                <div class="emblem-title">GALERÍA DE ARTE AUDIOVISUAL</div>
                <div class="emblem-subtitle">DEL ECOSISTEMA QUIMERA</div>
            </div>

            <div class="archway" id="archway-gate">
                <div class="gate-door gate-door-left">
                    <div class="gate-iron-bar"></div>
                    <div class="gate-knocker"></div>
                    <div class="gate-iron-bar"></div>
                </div>
                <div class="gate-door gate-door-right">
                    <div class="gate-iron-bar"></div>
                    <div class="gate-knocker"></div>
                    <div class="gate-iron-bar"></div>
                </div>
            </div>

            <button class="btn-enter" onclick="enterGallery()">ENTRAR A LA GALERÍA</button>
        </div>
    </div>

    <!-- HUD GUÍA EN PANTALLA -->
    <div id="hud-info">PASILLO CENTRAL 3D: AVANZA CON [ ↑ ]</div>

    <!-- CONTENEDOR 3D WEBGL -->
    <canvas id="webgl-canvas"></canvas>

    <!-- CONTROLES TÁCTILES MÓVILES -->
    <div class="dpad-container">
        <button class="dpad-btn dpad-up" onclick="movePlayer('up')">▲</button>
        <button class="dpad-btn dpad-left" onclick="movePlayer('left')">◀</button>
        <button class="dpad-btn dpad-enter" onclick="movePlayer('enter')">OK</button>
        <button class="dpad-btn dpad-right" onclick="movePlayer('right')">▶</button>
        <button class="dpad-btn dpad-down" onclick="movePlayer('down')">▼</button>
    </div>

    <!-- MODAL DE EXHIBICIÓN DE OBRAS / SALA DE AUDIO -->
    <div id="gallery-modal">
        <div class="modal-box">
            <!-- SECCIÓN VISUAL -->
            <div id="modal-content-visual" style="width: 100%;">
                <div class="modal-preview-box" id="modal-img-box">[ VISTA PREVIA DE LA OBRA ]</div>
            </div>

            <!-- SECCIÓN DE AUDIO CON REPRODUCTOR REAL -->
            <div id="modal-content-audio" style="width: 100%; display: none;">
                <div class="audio-player-container">
                    <div class="track-info" id="current-track-name">🎵 REPRODUCTOR QUIMERA: [Selecciona Pista]</div>
                    <div class="playlist" id="playlist-container">
                        <!-- Las pistas se cargan dinámicamente -->
                    </div>
                    <div class="player-controls">
                        <button class="ctrl-btn" onclick="prevTrack()">◀ ANTERIOR</button>
                        <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()">▶ REPRODUCIR</button>
                        <button class="ctrl-btn" onclick="nextTrack()">SIGUIENTE ▶</button>
                    </div>
                </div>
            </div>

            <h2 id="modal-title" style="color: var(--accent-gold); margin-bottom: 0.6rem; font-family: Georgia, serif;"></h2>
            <p id="modal-desc" style="color: #ffffff; line-height: 1.5; margin-bottom: 1.2rem; font-size: 0.95rem;"></p>
            <button class="btn-enter" style="margin-bottom:0;" onclick="closeModal()">CERRAR [ENTER]</button>
        </div>
    </div>

    <!-- SCRIPT DEL MOTOR THREE.JS Y REPRODUCTOR REAL -->
    <script>
        let scene, camera, renderer;
        let playerZ = 0, playerRotY = 0;
        let isModalOpen = false;

        // 🎵 AQUÍ CONECTAS TUS ARCHIVOS DE AUDIO REALES (.mp3, .wav, etc.)
        const soundTracks = [
            { title: "01. Tango Futuro (Lado A)", file: "01._Tango_Futuro_(Lado_A).mp3" },
            { title: "02. Tango Futuro (Lado B)", file: "02._Tango_Futuro_(Lado_B).mp3" },
            { title: "03. Nivea Tierra 2090ngo (Lado A)", file: "03._Nivea_Tierra_2090ngo_(Lado_A).mp3" },
            { title: "04. Nivea Tierra 2090ngo (Lado B)", file: "04._Nivea_Tierra_2090ngo_(Lado_B).mp3" },
            { title: "05. Tangénesis (Lado A)", file: "05._Tangénesis_(Lado_A).mp3" },
            { title: "06. Tangénesis (Lado B)", file: "06._Tangénesis_(Lado_B).mp3" },
            { title: "07. Un Último Tango (Lado A)", file: "07._Un_Último_Tango_(Lado_A).mp3" },
            { title: "08. Un Último Tango (Lado B)", file: "08._Un_Último_Tango_(Lado_B).mp3" },
            { title: "09. Quimera Milonga (Lado A)", file: "09._Quimera_Milonga_(Lado_A).mp3" },
            { title: "10. Quimera Milonga (Lado B)", file: "10._Quimera_Milonga_(Lado_B).mp3" },
            { title: "11. Tangépico (Lado A)", file: "11._Tangépico_(Lado_A).mp3" },
            { title: "12. Tangépico (Lado B)", file: "12._Tangépico_(Lado_B).mp3" },
            { title: "13. La Mirada De La Noche (Lado A)", file: "13._La_Mirada_De_La_Noche_(Lado_A).mp3" },
            { title: "14. La Mirada De La Noche (Lado B)", file: "14._La_Mirada_De_La_Noche_(Lado_B).mp3" },
            { title: "15. Jueves De Lluvia", file: "15._Jueves_De_Lluvia.mp3" },
            { title: "16. Libertad Real", file: "16._Libertad_Real.mp3" },
            { title: "17. Utopía Del Despertar", file: "17._Utopía_Del_Despertar.mp3" },
            { title: "18. La Idea En El Espejo (¡Recuerda, recuerda!)", file: "18._La_Idea_En_El_Espejo_(¡Recuerda,_recuerda!).mp3" },
            { title: "19. La Idea A Través Del Espejo (¡Recuerda, Recuerda!)", file: "19._La_Idea_A_Través_Del_Espejo_(¡Recuerda,_Recuerda!).mp3" },
            { title: "20. Tango De Obscuridad", file: "20._Tango_De_Obscuridad.mp3" },
            { title: "21. Tango de Luz 2.0", file: "21._Tango_de_Luz_2.0.mp3" },
            { title: "22. Tango De Luz", file: "22._Tango_De_Luz.mp3" },
            { title: "23. Futuro De Arrabal (Lado A)", file: "23._Futuro_De_Arrabal_(Lado_A).mp3" },
            { title: "24. Futuro De Arrabal (Lado B)", file: "24._Futuro_De_Arrabal_(Lado_B).mp3" }
        ];
        let currentTrackIndex = 0;
        let audioElement = new Audio();
        let isPlaying = false;

        // 🖼️ AQUÍ CONECTAS TUS ARCHIVOS DE IMAGEN REALES DE LAS SECCIONES
        const roomsData = [
            { id: 1, z: -15, type: "audio", title: "🎵 SALA DE AUDIO", desc: "Cabina acústica oficial del Instituto Quimera. Selecciona y escucha las pistas musicales del soundtrack oficial." },
            { id: 2, z: -30, type: "visual", title: "🖼️ SECCIÓN 01: ¿QUÉ ES QUIMERA?", desc: "Exposición visual dedicada al origen del concepto, la hibridez del mito y la esencia primordial del ecosistema.", file: "QueEsQuimera.webp" },
            { id: 3, z: -45, type: "visual", title: "🖼️ SECCIÓN 02: MISIÓN", desc: "Galería de ilustraciones y diagramas que sintetizan el propósito fundamental y la razón de ser del Instituto Quimera.", file: "Mision.webp" },
            { id: 4, z: -60, type: "visual", title: "🖼️ SECCIÓN 03: VISIÓN", desc: "Obras proyectivas que ilustran el horizonte académico, tecnológico y narrativo hacia el cual evoluciona Quimera.", file: "Vision.webp" },
            { id: 5, z: -75, type: "visual", title: "🖼️ SECCIÓN 04: PRINCIPIOS", desc: "Representaciones del decálogo axiológico, ética del búnker y pilares teóricos que sostienen la estructura.", file: "Principios.webp" },
            { id: 6, z: -90, type: "visual", title: "🖼️ SECCIÓN 05: DESARROLLO", desc: "Colección visual que documenta las etapas de diseño, arquitectura web e hitos de programación del ecosistema.", file: "Desarrollo.webp" },
            { id: 7, z: -105, type: "visual", title: "🖼️ SECCIÓN 06: MITOLOGÍA DETRÁS DE QUIMERA", desc: "El broche de oro de la galería: archivos conceptuales y mitológicos de Belerofonte y la Quimera cibernética.", file: "Mitologia.webp" }
        ];

        function createDynamicTexture(text, accentColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 712;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 0, 712);
            gradient.addColorStop(0, '#0b1329');
            gradient.addColorStop(1, '#020617');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 712);

            ctx.strokeStyle = accentColor;
            ctx.lineWidth = 16;
            ctx.strokeRect(10, 10, 492, 692);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(30, 30, 452, 652);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Georgia, serif';
            ctx.textAlign = 'center';
            
            const words = text.split(' ');
            let line = '';
            let y = 320;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > 400 && n > 0) {
                    ctx.fillText(line, 256, y);
                    line = words[n] + ' ';
                    y += 45;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 256, y);

            ctx.fillStyle = accentColor;
            ctx.font = '24px monospace';
            ctx.fillText('INSTITUTO QUIMERA', 256, 630);

            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020617, 0.025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const ambientLight = new THREE.AmbientLight(0x0f172a, 1.8);
            scene.add(ambientLight);

            for (let z = -10; z >= -120; z -= 25) {
                const color = (z % 50 === 0) ? 0x38bdf8 : 0xc88b32;
                const pointLight = new THREE.PointLight(color, 2, 25);
                pointLight.position.set(0, 4, z);
                scene.add(pointLight);
            }

            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
            const gridMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, opacity: 0.12, transparent: true });

            const hallwayLength = 130;
            const floorGeo = new THREE.PlaneGeometry(12, hallwayLength);
            
            const floor = new THREE.Mesh(floorGeo, wallMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, 0, -hallwayLength / 2);
            scene.add(floor);

            const ceiling = new THREE.Mesh(floorGeo, wallMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, 5, -hallwayLength / 2);
            scene.add(ceiling);

            const wallGeo = new THREE.PlaneGeometry(hallwayLength, 5);
            const leftWall = new THREE.Mesh(wallGeo, wallMaterial);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-6, 2.5, -hallwayLength / 2);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeo, wallMaterial);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.set(6, 2.5, -hallwayLength / 2);
            scene.add(rightWall);

            const gridFloor = new THREE.Mesh(floorGeo, gridMaterial);
            gridFloor.rotation.x = -Math.PI / 2;
            gridFloor.position.set(0, 0.01, -hallwayLength / 2);
            scene.add(gridFloor);

            roomsData.forEach(room => {
                const accentHex = (room.id % 2 === 0) ? '#38bdf8' : '#c88b32';
                const canvasTex = createDynamicTexture(room.title, accentHex);
                
                const frameGeo = new THREE.BoxGeometry(0.15, 3.2, 2.3);
                const frameMat = new THREE.MeshStandardMaterial({ map: canvasTex, roughness: 0.3 });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                
                const isLeft = (room.id % 2 !== 0);
                const sideX = isLeft ? -5.85 : 5.85;
                const rotY = isLeft ? Math.PI / 2 : -Math.PI / 2;

                frame.position.set(sideX, 2.4, room.z);
                frame.rotation.y = rotY;
                scene.add(frame);
            });

            setupPlaylistUI();
            animate();
        }

        // FUNCIONES DE CONTROL DE AUDIO REAL
        function setupPlaylistUI() {
            const container = document.getElementById('playlist-container');
            container.innerHTML = '';
            soundTracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = `track-item ${index === currentTrackIndex ? 'active' : ''}`;
                div.textContent = track.title;
                div.onclick = () => loadAndPlayTrack(index);
                container.appendChild(div);
            });
            updateTrackInfo();
        }

        function loadAndPlayTrack(index) {
            currentTrackIndex = index;
            audioElement.src = soundTracks[currentTrackIndex].file;
            audioElement.play().then(() => {
                isPlaying = true;
                updatePlayButton();
                setupPlaylistUI();
            }).catch(err => {
                console.log("Esperando interacción del usuario o archivo no encontrado:", err);
            });
        }

        function togglePlay() {
            if (!audioElement.src) {
                loadAndPlayTrack(currentTrackIndex);
                return;
            }
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
            } else {
                audioElement.play();
                isPlaying = true;
            }
            updatePlayButton();
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % soundTracks.length;
            loadAndPlayTrack(currentTrackIndex);
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + soundTracks.length) % soundTracks.length;
            loadAndPlayTrack(currentTrackIndex);
        }

        function updatePlayButton() {
            document.getElementById('play-pause-btn').textContent = isPlaying ? '⏸ PAUSAR' : '▶ REPRODUCIR';
        }

        function updateTrackInfo() {
            document.getElementById('current-track-name').textContent = `🎵 REPRODUCIENDO: ${soundTracks[currentTrackIndex].title}`;
        }

        audioElement.onended = () => {
            nextTrack();
        };

        function animate() {
            requestAnimationFrame(animate);
            camera.position.z = playerZ;
            camera.rotation.y = playerRotY;
            renderer.render(scene, camera);
        }

        function enterGallery() {
            const archway = document.getElementById('archway-gate');
            const entrance = document.getElementById('castle-entrance');

            archway.classList.add('gate-open');
            setTimeout(() => {
                entrance.style.opacity = '0';
                setTimeout(() => { entrance.style.display = 'none'; }, 1200);
            }, 600);
        }

        function movePlayer(direction) {
            if (isModalOpen) {
                if (direction === 'enter') closeModal();
                return;
            }

            const stepZ = 3.5;
            const stepRot = 0.15;

            switch (direction) {
                case 'up':
                    if (playerZ > -115) playerZ -= stepZ;
                    break;
                case 'down':
                    if (playerZ < 0) playerZ += stepZ;
                    break;
                case 'left':
                    playerRotY += stepRot;
                    break;
                case 'right':
                    playerRotY -= stepRot;
                    break;
                case 'enter':
                    checkRoomEntry();
                    return;
            }

            updateHUD();
        }

        function updateHUD() {
            const hud = document.getElementById('hud-info');
            const activeRoom = roomsData.find(r => Math.abs(playerZ - r.z) < 4);

            if (activeRoom) {
                hud.textContent = `EXHIBICIÓN CERCA: [ ${activeRoom.title} ] - PRESIONA ENTER`;
            } else {
                hud.textContent = "PASILLO CENTRAL 3D: AVANZA CON [ ↑ ]";
            }
        }

        function checkRoomEntry() {
            const activeRoom = roomsData.find(r => Math.abs(playerZ - r.z) < 4);
            if (activeRoom) {
                openModal(activeRoom);
            }
        }

        function openModal(room) {
            document.getElementById('modal-title').textContent = room.title;
            document.getElementById('modal-desc').textContent = room.desc;

            const visualBox = document.getElementById('modal-content-visual');
            const audioBox = document.getElementById('modal-content-audio');

            if (room.type === 'audio') {
                visualBox.style.display = 'none';
                audioBox.style.display = 'block';
            } else {
                audioBox.style.display = 'none';
                visualBox.style.display = 'block';
                const imgBox = document.getElementById('modal-img-box');
                imgBox.textContent = "";
                imgBox.style.backgroundImage = `url('${room.file}')`;
            }

            document.getElementById('gallery-modal').classList.add('show');
            isModalOpen = true;
        }

        function closeModal() {
            document.getElementById('gallery-modal').classList.remove('show');
            isModalOpen = false;
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': movePlayer('up'); break;
                case 'ArrowDown': movePlayer('down'); break;
                case 'ArrowLeft': movePlayer('left'); break;
                case 'ArrowRight': movePlayer('right'); break;
                case 'Enter': movePlayer('enter'); break;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('DOMContentLoaded', init3D);
    </script>
</body>
</html>
