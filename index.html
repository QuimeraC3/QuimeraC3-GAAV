<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALERÍA DE ARTE AUDIOVISUAL &bull; Instituto Quimera</title>
    
    <style>
        :root {
            --bg-dark: #030712;
            --accent-gold: #c88b32;
            --accent-blue: #38bdf8;
            --grid-line: rgba(56, 189, 248, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* CAPA CRT SCANLINES GLOBAL */
        .crt-scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 2000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.7;
        }

        /* PANTALLA DE FACHADA (ENTRADA AL CASTILLO) */
        #castle-entrance {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.8), #000000), url('Quimeratrix.webp') center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1.2s ease, filter 1.2s ease;
        }

        .emblem-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .emblem-title {
            font-family: Georgia, serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--accent-gold);
            -webkit-text-stroke: 1px #ffffff;
            text-shadow: 0 0 20px rgba(200, 139, 50, 0.8), 0 0 40px rgba(56, 189, 248, 0.5);
            letter-spacing: 0.1em;
        }

        .emblem-subtitle {
            font-family: monospace;
            color: var(--accent-blue);
            font-size: clamp(0.9rem, 2vw, 1.3rem);
            margin-top: 0.5rem;
            letter-spacing: 0.2em;
        }

        .btn-enter {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--accent-gold);
            color: #ffffff;
            padding: 0.8rem 2.5rem;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(200, 139, 50, 0.4);
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            background: var(--accent-gold);
            color: #000000;
            box-shadow: 0 0 35px var(--accent-gold);
            transform: scale(1.05);
        }

        /* ENTORNOS Y PASILLO 3D */
        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 800px;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle at center, #0a101d, #000000);
        }

        #hallway {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        /* PAREDES DEL PASILLO */
        .wall {
            position: absolute;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--grid-line);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .wall-left {
            width: 3000px; height: 1000px;
            left: -1500px; top: -100px;
            transform: rotateY(90deg) translateZ(-500px);
            background-image: linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 100px 100%;
        }

        .wall-right {
            width: 3000px; height: 1000px;
            left: -1500px; top: -100px;
            transform: rotateY(-90deg) translateZ(-500px);
            background-image: linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 100px 100%;
        }

        /* MARCOS DE LAS OBRAS DE ARTE / ACCESOS EN LAS PAREDES */
        .art-frame {
            position: absolute;
            width: 220px;
            height: 300px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid var(--accent-gold);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(200, 139, 50, 0.5);
            transition: all 0.3s ease;
        }

        .art-frame.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 45px var(--accent-blue);
            transform: scale(1.08);
        }

        .art-frame-title {
            font-family: Georgia, serif;
            color: #ffffff;
            font-size: 1rem;
            text-align: center;
            padding: 0.5rem;
            text-transform: uppercase;
        }

        /* HUD / NAVEGACIÓN Y GUÍA */
        #hud-info {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--accent-blue);
            padding: 0.6rem 2rem;
            border-radius: 20px;
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--accent-blue);
            z-index: 100;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            text-align: center;
        }

        /* CONTROLES TÁCTILES MÓVILES */
        .dpad-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 160px;
            height: 160px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 100;
        }

        .dpad-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid var(--accent-blue);
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .dpad-btn:active {
            background: var(--accent-blue);
            color: #000000;
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-down { grid-column: 2; grid-row: 3; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-enter { grid-column: 2; grid-row: 2; border-color: var(--accent-gold); color: var(--accent-gold); }

        /* MODAL DE EXHIBICIÓN CRT */
        #gallery-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 3000;
        }

        #gallery-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #0b1329;
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="crt-scanlines"></div>

    <!-- FACHADA DEL CASTILLO / PORTÓN DE ENTRADA -->
    <div id="castle-entrance">
        <div class="emblem-container">
            <div class="emblem-title">GALERÍA DE ARTE AUDIOVISUAL</div>
            <div class="emblem-subtitle">DEL ECOSISTEMA QUIMERA</div>
        </div>
        <button class="btn-enter" onclick="enterGallery()">ENTRAR A LA GALERÍA</button>
    </div>

    <!-- HUD INDICADOR DE POSICIÓN -->
    <div id="hud-info">PASILLO CENTRAL: AVANZA CON [ ↑ ]</div>

    <!-- MOTOR DEL PASILLO 3D -->
    <div id="viewport">
        <div id="hallway">
            <div class="wall wall-left"></div>
            <div class="wall wall-right"></div>

            <!-- OBRAS / ACCESOS EN EL PASILLO -->
            <div class="art-frame" id="frame-1" style="transform: translate3d(-350px, -50px, -600px) rotateY(30deg);">
                <div class="art-frame-title">🎵 SALA DE AUDIO</div>
            </div>

            <div class="art-frame" id="frame-2" style="transform: translate3d(150px, -50px, -1200px) rotateY(-30deg);">
                <div class="art-frame-title">🖼️ SECCIÓN 01: ¿QUÉ ES QUIMERA?</div>
            </div>

            <div class="art-frame" id="frame-3" style="transform: translate3d(-350px, -50px, -1800px) rotateY(30deg);">
                <div class="art-frame-title">🖼️ SECCIÓN 02: MISIÓN</div>
            </div>
        </div>
    </div>

    <!-- CONTROLES TÁCTILES PARA MÓVIL -->
    <div class="dpad-container">
        <button class="dpad-btn dpad-up" onclick="movePlayer('up')">▲</button>
        <button class="dpad-btn dpad-left" onclick="movePlayer('left')">◀</button>
        <button class="dpad-btn dpad-enter" onclick="movePlayer('enter')">OK</button>
        <button class="dpad-btn dpad-right" onclick="movePlayer('right')">▶</button>
        <button class="dpad-btn dpad-down" onclick="movePlayer('down')">▼</button>
    </div>

    <!-- VENTANA MODAL PARA INSPECCIONAR OBRAS -->
    <div id="gallery-modal">
        <div class="modal-box">
            <h2 id="modal-title" style="color: var(--accent-gold); margin-bottom: 1rem;"></h2>
            <p id="modal-desc" style="color: #ffffff; line-height: 1.6; margin-bottom: 1.5rem;"></p>
            <button class="btn-enter" onclick="closeModal()">CERRAR [ENTER]</button>
        </div>
    </div>

    <script>
        // ESTADO DE NAVEGACIÓN EN EL PASILLO
        let posZ = 0;       // Avanzar/Retroceder (-Z hacia el fondo)
        let rotY = 0;       // Rotación a la izquierda o derecha
        let isModalOpen = false;

        const hallway = document.getElementById('hallway');
        const hudInfo = document.getElementById('hud-info');

        // FUNCIÓN DE TRANSICIÓN DESDE LA FACHADA
        function enterGallery() {
            const entrance = document.getElementById('castle-entrance');
            entrance.style.opacity = '0';
            setTimeout(() => {
                entrance.style.display = 'none';
            }, 1200);
        }

        // MOTOR DE MOVIMIENTO DEL JUGADOR
        function movePlayer(direction) {
            if (isModalOpen) {
                if (direction === 'enter') closeModal();
                return;
            }

            const stepZ = 300;   // Distancia de avance por cada tecla ↑ / ↓
            const stepRot = 15;  // Grados de giro por cada tecla ← / →

            switch (direction) {
                case 'up':
                    if (posZ < 2100) posZ += stepZ;
                    break;
                case 'down':
                    if (posZ > 0) posZ -= stepZ;
                    break;
                case 'left':
                    rotY += stepRot;
                    break;
                case 'right':
                    rotY -= stepRot;
                    break;
                case 'enter':
                    checkRoomEntry();
                    return;
            }

            updateHallwayTransform();
        }

        // ACTUALIZAR LA PERSPECTIVA DEL PASILLO
        function updateHallwayTransform() {
            hallway.style.transform = `translateZ(${posZ}px) rotateY(${rotY}deg)`;

            // HUD DINÁMICO SEGÚN LA PROFUNDIDAD
            if (posZ >= 300 && posZ < 900) {
                hudInfo.textContent = "SALA ENCONTRADA: [🎵 SALA DE AUDIO] - PRESIONA ENTER";
                document.getElementById('frame-1').classList.add('active');
            } else if (posZ >= 900 && posZ < 1500) {
                hudInfo.textContent = "SALA ENCONTRADA: [🖼️ SECCIÓN 01: ¿QUÉ ES QUIMERA?] - PRESIONA ENTER";
                document.getElementById('frame-2').classList.add('active');
            } else if (posZ >= 1500) {
                hudInfo.textContent = "SALA ENCONTRADA: [🖼️ SECCIÓN 02: MISIÓN] - PRESIONA ENTER";
                document.getElementById('frame-3').classList.add('active');
            } else {
                hudInfo.textContent = "PASILLO CENTRAL: USA [ ↑ ] PARA AVANZAR";
                document.querySelectorAll('.art-frame').forEach(f => f.classList.remove('active'));
            }
        }

        // ACCEDER A LA SALA / OBRA
        function checkRoomEntry() {
            let title = "";
            let desc = "";

            if (posZ >= 300 && posZ < 900) {
                title = "SALA DE AUDIO";
                desc = "Has ingresado a la cabina de sonido. Aquí se alojarán las pistas musicales del Soundtrack del Instituto Quimera.";
            } else if (posZ >= 900 && posZ < 1500) {
                title = "SECCIÓN 01: ¿QUÉ ES QUIMERA?";
                desc = "Galería visual dedicada a los orígenes del concepto y la naturaleza del Instituto.";
            } else if (posZ >= 1500) {
                title = "SECCIÓN 02: MISIÓN";
                desc = "Galería visual dedicada al propósito y pilares fundamentales de Quimera.";
            } else {
                return;
            }

            openModal(title, desc);
        }

        function openModal(title, desc) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            document.getElementById('gallery-modal').classList.add('show');
            isModalOpen = true;
        }

        function closeModal() {
            document.getElementById('gallery-modal').classList.remove('show');
            isModalOpen = false;
        }

        // CAPTURA DE EVENTOS DE TECLADO
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    movePlayer('up');
                    break;
                case 'ArrowDown':
                    movePlayer('down');
                    break;
                case 'ArrowLeft':
                    movePlayer('right');
                    break;
                case 'ArrowRight':
                    movePlayer('left');
                    break;
                case 'Enter':
                    movePlayer('enter');
                    break;
            }
        });
    </script>
</body>
</html>
